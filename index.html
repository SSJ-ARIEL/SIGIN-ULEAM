<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f8f4ed" />
    <meta
      name="description"
      content="SIGIN: aula de aprendizaje práctico de competencias informacionales, comercio exterior y gobierno electrónico."
    />
    <title>SIGIN · Tu aula, en acción</title>
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("sigin-theme-v1");
          if (["light", "dark", "system"].includes(saved)) preference = saved;
        } catch {}
        const theme = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#1c1817" : "#f8f4ed";
      })();
    </script>
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/motion.css" />
  </head>
  <body>
    <a class="skip" href="#main">Saltar al contenido</a>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
